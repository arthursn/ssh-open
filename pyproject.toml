[project]
name = "ssh-open"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Arthur Nishikawa", email = "nishikawa.poli@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.11.11",
    "tomli>=2.4.1",
]

[project.scripts]
ssho = "ssh_open.ssh_wrapper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.package-data]
ssh_open = ["assets/*"]

[tool.ruff.lint]
ignore = ["S110", "BLE"]
